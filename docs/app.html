<!doctype html>
<html lang="en" data-theme="light" data-bg="peach" data-btn="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trove</title>
<meta name="description" content="Buy and sell anything. Your money is held until the item is in your hands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* White page, beige surfaces, light blue for selection, creamy orange for actions. Photos carry the colour. */
:root{
  --bg:#ffffff; --surface:#faf6ef; --line:#ece5d8; --ink:#1f2328; --muted:#686d74;
  --blue:#dcebf8; --blue-ink:#2a5d88;
  --orange:#ffcb98; --orange-hover:#ffb877; --orange-ink:#3b2410; --orange-soft:#fff1e1;
  --red:#b4432f; --red-soft:#fde8e3;
  --focus:#2a5d88;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c-other:#9aa0a6; --neg:#e34948; --total:#184f95;
  --s0:#ece8e1; --s1:#cde2fb; --s2:#9ec5f4; --s3:#6da7ec; --s4:#2a78d6; --s5:#184f95;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
/* Colour drafts (Settings or the demo bar). Light mode only; dark mode keeps its own tokens below. */
:root[data-bg="cream"]{--bg:#fdf5e8; --surface:#f5e9d6; --line:#e9dcc6}
:root[data-bg="blue"]{--bg:#eaf3fc; --surface:#ffffff; --line:#d3e3f2; --blue:#cfe2f5}
:root[data-bg="peach"]{--bg:#fff0e2; --surface:#ffffff; --line:#f3dcc6}
:root[data-btn="cream"]{--orange:#ffe6cc; --orange-hover:#ffd8ad; --orange-ink:#4a2e12; --orange-soft:#fff6ec}
:root[data-btn="navy"]{--orange:#2f5f8a; --orange-hover:#264f74; --orange-ink:#ffffff; --orange-soft:#fff1e1}
:root[data-btn="ink"]{--orange:#1f2328; --orange-hover:#3a3f45; --orange-ink:#ffffff; --orange-soft:#fff1e1}
:root[data-btn="sage"]{--orange:#cfe3d4; --orange-hover:#b9d6c0; --orange-ink:#1d3a26; --orange-soft:#fff1e1}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1e2125; --line:#30343a; --ink:#eceef0; --muted:#a3a9b0;
    --blue:#203345; --blue-ink:#8fc1ea;
    --orange:#f2b47a; --orange-hover:#f6c393; --orange-ink:#2a1a0b; --orange-soft:#36291c;
    --red:#ee9480; --red-soft:#3b2420; --focus:#8fc1ea; color-scheme:dark;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c-other:#7b828b; --neg:#e34948; --total:#86b6ef;
  --s0:#2a2e34; --s1:#104281; --s2:#1c5cab; --s3:#2a78d6; --s4:#5598e7; --s5:#9ec5f4;
  }
}
:root[data-theme="dark"]{
    --bg:#15171a; --surface:#1e2125; --line:#30343a; --ink:#eceef0; --muted:#a3a9b0;
    --blue:#203345; --blue-ink:#8fc1ea;
    --orange:#f2b47a; --orange-hover:#f6c393; --orange-ink:#2a1a0b; --orange-soft:#36291c;
    --red:#ee9480; --red-soft:#3b2420; --focus:#8fc1ea; color-scheme:dark;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c-other:#7b828b; --neg:#e34948; --total:#86b6ef;
  --s0:#2a2e34; --s1:#104281; --s2:#1c5cab; --s3:#2a78d6; --s4:#5598e7; --s5:#9ec5f4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
a{color:var(--blue-ink)}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0 0 .5em;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:9;background:var(--bg);padding:8px}

/* header */
header.top{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{font-size:1.6rem;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.logo span{color:var(--orange-hover)}
form.search{flex:1;display:flex;max-width:560px}
form.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font:inherit;border-radius:999px 0 0 999px}
form.search button{border-radius:0 999px 999px 0}
nav.main{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.main>a,nav.main summary{color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.95rem;white-space:nowrap;cursor:pointer;list-style:none}
nav.main summary::-webkit-details-marker{display:none}
nav.main>a[aria-current=page]{background:var(--blue)}
nav.main>a.sell{background:var(--orange);color:var(--orange-ink)}
.menu{position:relative}
.menu[open] summary{background:var(--blue)}
.menu .drop{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:180px;display:flex;flex-direction:column}
.menu .drop a{padding:9px 12px;border-radius:6px;color:var(--ink);text-decoration:none}
.menu .drop a:hover{background:var(--surface)}
.menu .drop.wide{left:0;right:auto;min-width:260px;padding:10px}
.drop h4{margin:6px 8px 4px;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.drop .opts{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 6px}
.drop .opts a{padding:5px 12px;border-radius:999px;background:var(--surface);font-size:.9rem}
.drop .opts a[aria-current=true]{background:var(--blue);color:var(--blue-ink)}
.look{position:relative}
.look summary{cursor:pointer;font-weight:700;color:var(--blue-ink);list-style:none;padding:2px 10px;border:1px solid var(--blue-ink);border-radius:999px;font-size:.82rem}
.look summary::-webkit-details-marker{display:none}
.look-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:12;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:270px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.look-pop b{display:block;font-size:.8rem;margin:2px 0 6px}
.sw{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.look-pop .sw button{background:none;border:0;padding:0;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;font-weight:600;color:var(--ink);line-height:1.2;text-align:center}
.look-pop .sw i{display:block;width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.look-pop .sw button[aria-pressed=true] i{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.look-pop{width:320px}
@media (max-width:760px){.look-pop{position:fixed;left:16px;right:16px;top:48px;width:auto}}
.count{display:inline-block;min-width:1.35em;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--orange);color:var(--orange-ink);font-size:.75rem;text-align:center;line-height:1.4;font-weight:700}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:8px}
  form.search{order:3;flex-basis:100%;max-width:none}
  nav.main>a,nav.main summary{padding:7px 9px;font-size:.9rem}
}

/* controls */
button,.btn{font:inherit;font-weight:700;border:1px solid var(--orange);background:var(--orange);color:var(--orange-ink);padding:9px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
button:hover,.btn:hover{background:var(--orange-hover);border-color:var(--orange-hover)}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover,.btn.ghost:hover{background:var(--surface)}
button.warn{background:var(--red);border-color:var(--red);color:#fff}
button.small{padding:5px 12px;font-size:.88rem}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;max-width:100%}
textarea{width:100%;min-height:80px}
label.f{display:block;margin:0 0 16px}
label.f>span{display:block;font-weight:600;margin-bottom:4px}
label.f small,.hint{display:block;color:var(--muted);font-size:.86rem;font-weight:400}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.radio{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg);cursor:pointer}
.radio:has(input:checked){border-color:var(--blue-ink);background:var(--blue)}
.radio input{margin-top:4px}
.radio b{display:block}
.radio .muted{font-size:.9rem}

/* layout bits */
main{padding-block:24px 64px;min-height:60vh}
main:focus{outline:none}
.lede{color:var(--muted);max-width:60ch;margin:0 0 18px}
.panel{background:var(--surface);border-radius:12px;padding:20px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--blue);color:var(--blue-ink);margin-right:4px}
.chip.orange{background:var(--orange-soft);color:var(--orange-ink)}
.chip.red{background:var(--red-soft);color:var(--red)}
.muted{color:var(--muted)}
.notice{background:var(--orange-soft);padding:10px 14px;border-radius:10px;margin:10px 0}
.notice.err{background:var(--red-soft)}
.notice.ok{background:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:.94rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}

/* browse */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.cats a{white-space:nowrap;padding:6px 14px;border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:600}
.cats a[aria-current=true]{background:var(--blue);color:var(--blue-ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 18px}
.card{display:block;text-decoration:none;color:var(--ink)}
.card .ph{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface);max-width:100%}
.card .ph img,.card .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:.98rem;font-weight:600;margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{font-weight:800;font-size:1.05rem}
.card .meta{font-size:.84rem;color:var(--muted)}
.card:hover h3{text-decoration:underline}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}

/* item */
.gallery .main-ph{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface);max-width:100%}
.gallery .main-ph img,.gallery .main-ph svg{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumbs button{padding:0;border:2px solid transparent;background:none;width:68px;height:68px;overflow:hidden;border-radius:8px}
.thumbs button[aria-pressed=true]{border-color:var(--blue-ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:16px 0}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0}
.bigprice{font-size:1.9rem;font-weight:800;margin:0 0 10px}
.flaws{background:var(--orange-soft);padding:10px 14px;border-radius:10px;margin:12px 0}
.seller{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0;text-decoration:none;color:var(--ink)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.protect{font-size:.9rem;color:var(--muted);margin-top:14px}

/* photo upload */
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--surface);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--blue-ink);background:var(--blue)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop b{display:block;font-size:1.05rem}
.previews{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.previews figure{margin:0;position:relative}
.previews img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.previews figcaption{font-size:.75rem;text-align:center;color:var(--muted)}

/* order */
.money{display:flex;margin:14px 0 22px;padding:0;list-style:none;gap:6px}
.money .st{flex:1;padding:8px 6px;border-top:4px solid var(--line);font-size:.9rem;color:var(--muted)}
.money .st.done{border-color:var(--blue-ink);color:var(--ink)}
.money .st.cur{font-weight:700}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative}
.timeline li::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--blue-ink)}
.timeline time{display:block;font-size:.82rem;color:var(--muted)}
.code{font-size:2.6rem;font-weight:800;letter-spacing:.18em;padding:4px 0;font-variant-numeric:tabular-nums}

/* dashboard */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);border-color:var(--orange-hover)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--surface);border-radius:12px;padding:14px 16px}
.tile b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.9rem}
.todo{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.todo header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.packimg{width:90px;height:90px;object-fit:cover;border-radius:8px}

/* front page */
.hero{margin:0 0 22px}
.hero-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hero h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:0;letter-spacing:-.01em}
.features{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.feat{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;transition:transform .15s}
.feat:hover{transform:translateY(-2px)}
.feat .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px;background:var(--blue);color:var(--blue-ink)}
.feat:nth-child(even) .ic{background:var(--orange);color:var(--orange-ink)}
.feat b{font-size:1.02rem}
.feat span:last-child{color:var(--muted);font-size:.88rem}
@media (max-width:760px){.features{grid-template-columns:repeat(2,minmax(0,1fr))}.feat{padding:12px}}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills a{padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.86rem;white-space:nowrap}
.pills a[aria-current=true]{background:var(--blue);border-color:var(--blue-ink);color:var(--blue-ink)}
h2.sub{font-size:1.1rem;margin:0}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 0 4px;margin-bottom:22px}
.strip a{flex:none;width:92px;color:var(--ink);text-decoration:none;font-size:.86rem}
.strip .ph{display:block;width:92px;height:92px;border-radius:10px;overflow:hidden;background:var(--surface)}
.strip .ph img,.strip .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.shelf{margin-bottom:28px}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.shelf-head a{font-size:.9rem;font-weight:600}
.shelf h3{margin:8px 0 12px}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px 10px}
.grid.compact h3{font-size:.86rem;margin-top:6px}
.grid.compact .price{font-size:.92rem}
.grid.compact .meta{display:none}
@media (max-width:760px){.grid.compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}}

/* hero v2 */
.hero-title{display:flex;gap:14px;align-items:center}
.hero-title .lede{margin:4px 0 0}
.fee-badge{flex:none;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--orange);color:var(--orange-ink)}
.feat .ic{border-radius:14px!important;width:50px!important;height:50px!important}
.feat svg .d,.fee-badge svg .d{fill:currentColor;fill-opacity:.16}
.fchip{display:inline-flex;gap:4px;align-items:center;padding:4px 12px;border-radius:999px;background:var(--blue);color:var(--blue-ink);text-decoration:none;font-size:.88rem;font-weight:600}
@media (max-width:760px){.fee-badge{width:52px;height:52px;border-radius:14px}.fee-badge svg{width:36px;height:36px}}

/* tour: a card at the bottom, and a highlight ring that follows the part being explained */
.tour-ring{position:fixed;z-index:45;pointer-events:none;border-radius:12px;box-shadow:0 0 0 3px var(--orange-hover),0 0 0 9999px rgba(10,11,13,.5);transition:left .25s,top .25s,width .25s,height .25s}
@media (prefers-reduced-motion:reduce){.tour-ring{transition:none}}
.tour-card{position:fixed;z-index:50;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(480px,calc(100% - 24px));background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.tour-card h3{margin:10px 0 4px;font-size:1.12rem}
.tour-card p{margin:0 0 12px;color:var(--muted);font-size:.95rem;line-height:1.45}
.tc-top{display:flex;align-items:center;gap:10px}
.tc-top select{font-size:.82rem;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--surface)}
.tc-count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tc-x{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:1rem;padding:4px 8px;border-radius:8px;cursor:pointer}
.tc-x:hover{background:var(--surface);color:var(--ink)}
.tc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc-dots{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:wrap}
.tc-dots button{width:8px;height:8px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.tc-dots button.on{width:20px;border-radius:4px;background:var(--orange-hover)}
.tc-ex{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue-ink);background:var(--blue);padding:2px 8px;border-radius:999px}
html.touring .demo{opacity:.5;pointer-events:none}

/* charts, schedule, interest */
.chart{width:100%;max-width:560px;height:auto;display:block;margin:6px 0 22px}
.chart rect.bar{fill:var(--c1)} .chart rect.zero{fill:var(--line)}
.chart text{fill:var(--muted);font:11px var(--sans)} .chart text.val{fill:var(--ink);font-weight:700}
.chart line{stroke:var(--line)}
.hbars{display:grid;gap:9px;margin:8px 0 10px}
.hbar{display:grid;grid-template-columns:minmax(70px,10em) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{background:var(--surface);border-radius:6px;height:14px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--blue-ink);border-radius:6px}
.hbar b{font-variant-numeric:tabular-nums;font-size:.88rem}
a.tile{color:var(--ink);text-decoration:none}
a.tile:hover{background:var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:22px}
.day{background:var(--surface);border-radius:10px;padding:6px 4px;text-align:center;position:relative;min-height:58px}
.day span{display:block;font-size:.72rem;color:var(--muted)}
.day b{font-size:1.05rem}
.day.busy{background:var(--orange-soft)}
.day.today{outline:2px solid var(--blue-ink);outline-offset:-2px}
.day i{position:absolute;top:4px;right:5px;font-style:normal;font-size:.7rem;font-weight:800;background:var(--orange);color:var(--orange-ink);border-radius:9px;min-width:16px;line-height:16px}
h3.dayhead{margin:18px 0 8px}
.slot{display:flex;gap:14px;align-items:center;color:var(--ink);text-decoration:none}
.slot time{font-weight:800;min-width:4.5em;font-variant-numeric:tabular-nums}
.slot>span:nth-child(2){flex:1;min-width:0}
.interest{display:flex;gap:14px;align-items:flex-start}
.interest .thumb{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surface)}
.interest .thumb img,.interest .thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.interest a{color:var(--ink);text-decoration:none}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin:4px 0}
.stats b{color:var(--ink)}
.people{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.drop.bulk{flex:1;min-width:220px;padding:12px 16px;text-align:left}
.drop.bulk b{font-size:.98rem}

/* demo bar, footer */
.demo{background:var(--blue);color:var(--ink);font-size:.86rem}
.demo .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:6px}
.demo button{background:transparent;border-color:var(--blue-ink);color:var(--blue-ink);padding:2px 10px;font-size:.82rem}
footer.foot{border-top:1px solid var(--line);padding-block:20px 36px;color:var(--muted);font-size:.9rem}
footer.foot nav{display:flex;flex-wrap:wrap;gap:6px 20px}
footer.foot a{color:var(--muted)}
.legal{max-width:68ch}
.legal h2{margin-top:1.4em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Insights charts. Series colours carry identity only; all text stays in ink or muted. */
.seg{display:inline-flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px;margin:4px 0 18px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--ink);border:0;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tile small.delta{display:block;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--ink)}
.tile small.delta span{font-weight:400;color:var(--muted)}
.tile small.up::first-letter{color:var(--c3)} .tile small.down::first-letter{color:var(--neg)}
.viz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:860px){.viz-grid{grid-template-columns:1fr}}
.viz{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.viz.wide{grid-column:1/-1} .viz.wide .chart{max-width:760px}
@media (max-width:860px){.viz.wide{grid-column:auto}}
.viz h2{margin:0 0 4px;font-size:1.05rem}
.viz .take{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.viz .chart{max-width:none;margin:4px 0 6px;overflow:visible}
.viz .chart text{fill:var(--muted);font:13px var(--sans)}
.viz .cal-heat text{font-size:9px} .viz .age text{font-size:12px} .viz .db text{font-size:12px}
.viz .chart text.val{fill:var(--ink);font-weight:700;font-size:14px}
.viz .chart line.axis{stroke:var(--line);stroke-width:1}
.viz .chart line.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.viz .chart line.conn{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.viz .chart .hit{fill:transparent;cursor:default;outline:none}
.viz .chart [data-act]{cursor:pointer}
.viz .chart .hit:focus-visible,.viz .chart .row-hit:focus-visible .hit{stroke:var(--focus);stroke-width:2;fill:var(--blue);fill-opacity:.35}
.viz .chart .row-hit{outline:none} .viz .chart .row-hit:hover .hit{fill:var(--surface)}
.viz .chart .hit.on{fill:var(--blue);fill-opacity:.5}
.m.add,.legend i.add{fill:var(--c1);background:var(--c1)}
.m.sub,.legend i.sub{fill:var(--neg);background:var(--neg)}
.m.total,.legend i.total{fill:var(--total);background:var(--total)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--ink);margin:0 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.c1{background:var(--c1)} .legend i.c2{background:var(--c2)} .legend i.c3{background:var(--c3)} .legend i.other{background:var(--c-other)}
.legend i.cost{background:var(--bg);border:2px solid var(--muted);width:11px;height:11px}
.dot{stroke:var(--bg);stroke-width:2} .dot.c1{fill:var(--c1)} .dot.c2{fill:var(--c2)} .dot.c3{fill:var(--c3)} .dot.other{fill:var(--c-other)}
.chart .s0,.ramp .s0,.heat .s0{fill:var(--s0);background:var(--s0)}
.chart .s1,.ramp .s1,.heat .s1{fill:var(--s1);background:var(--s1)}
.chart .s2,.ramp .s2,.heat .s2{fill:var(--s2);background:var(--s2)}
.chart .s3,.ramp .s3,.heat .s3{fill:var(--s3);background:var(--s3)}
.chart .s4,.ramp .s4,.heat .s4{fill:var(--s4);background:var(--s4)}
.chart .s5,.ramp .s5,.heat .s5{fill:var(--s5);background:var(--s5)}
.cal-heat rect{outline:none} .cal-heat rect:hover,.cal-heat rect:focus-visible{stroke:var(--ink);stroke-width:1.5}
.ramp{display:flex;align-items:center;gap:3px;font-size:.78rem;color:var(--muted)}
.ramp i{width:12px;height:12px;border-radius:3px;display:inline-block} .ramp span{margin:0 4px}
.age .m.a0{fill:var(--s2)} .age .m.a1{fill:var(--s3)} .age .m.a2{fill:var(--s4)} .age .m.a3{fill:var(--s5)} .age .m.zero{fill:var(--line)}
.agelist{background:var(--surface);border-radius:10px;padding:10px 14px;margin-top:6px}
.agelist h3{margin:0 0 6px;font-size:.92rem} .agelist ul{margin:0;padding-left:18px;font-size:.9rem} .agelist a.small{font-size:.82rem;margin-left:6px}
.db .bar-l{stroke:var(--line);stroke-width:4;stroke-linecap:round}
.db circle.cost{fill:var(--bg);stroke:var(--muted);stroke-width:2} .db circle.price{fill:var(--c1);stroke:var(--bg);stroke-width:2}
.db text.cat{fill:var(--ink);font-size:12px} .db text.val{font-weight:700}
.funnel{display:grid;gap:8px;font-size:.9rem}
.fstep{display:grid;grid-template-columns:minmax(80px,9em) 1fr 3.2em 3em;gap:10px;align-items:center;border-radius:6px;outline:none}
.fstep:hover,.fstep:focus-visible{background:var(--surface)} .fstep:focus-visible{box-shadow:0 0 0 2px var(--focus)}
.fstep.head{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)} .fstep.head b,.fstep.head em{font-weight:600}
.fstep b,.fstep em{text-align:right;font-variant-numeric:tabular-nums} .fstep em{font-style:normal;color:var(--muted)}
.ftrack{height:22px;display:flex;justify-content:center} .ftrack i{display:block;height:100%;background:var(--c1);border-radius:4px}
.heat{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:3px;font-size:.8rem;align-items:center}
.heat b{font-weight:600;color:var(--muted);text-align:center;font-size:.74rem}
.heat span{color:var(--muted);padding-right:6px}
.heat i{display:flex;align-items:center;justify-content:center;height:28px;border-radius:5px;font-style:normal;font-weight:700;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.heat i.hi{color:#fff} .heat i:hover,.heat i:focus-visible{box-shadow:0 0 0 2px var(--ink) inset}
details.tbl{margin-top:8px;font-size:.88rem} details.tbl summary{cursor:pointer;color:var(--blue-ink);font-weight:600}
details.tbl table{margin-top:6px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;line-height:1.4;padding:7px 10px;border-radius:8px;white-space:pre-line;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .heat i.hi{color:#15171a}}
:root[data-theme="dark"] .heat i.hi{color:#15171a}

/* Seller console: sidebar + page, in the style of cloud dashboards */
#app.console{max-width:1440px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:0;padding-top:0;padding-left:0}
#app.console .side{position:sticky;top:0;align-self:start;height:calc(100vh - 120px);overflow-y:auto;border-right:1px solid var(--line);padding:18px 14px 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.side .proj{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.side .av{width:30px;height:30px;flex:none;border-radius:8px;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;font-weight:800}
.side .pname{display:grid;min-width:0;flex:1}
.side .pname small{font-size:.7rem;color:var(--muted);line-height:1.2}
.side .pname select{border:0;background:transparent;padding:0;font-weight:700;font-size:.9rem;width:100%;cursor:pointer}
.side .newbtn{justify-content:center;font-size:.9rem;padding:8px 12px;text-align:center}
.side nav{display:grid;gap:2px}
.side h6{margin:14px 10px 4px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem}
.side nav a:hover{background:var(--surface);color:var(--ink)}
.side nav a[aria-current=page]{background:var(--blue);color:var(--blue-ink)}
.side nav a .count{margin-left:auto;font-size:.72rem;background:var(--orange);color:var(--orange-ink);border-radius:999px;padding:0 7px;font-weight:700}
#app.console .pane{min-width:0;padding:22px 0 40px 32px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.phead h1{margin:2px 0 2px;font-size:1.55rem;letter-spacing:-.015em}
.phead .pdesc{margin:0;color:var(--muted);font-size:.92rem}
.crumbs{display:flex;gap:8px;font-size:.8rem;color:var(--muted)}
.pact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pact .seg{margin:0}
.sechead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sechead h2{margin:0;font-size:1.1rem}
.console .tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.console .tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.console .tile>span{order:-1;font-size:.78rem;font-weight:600;color:var(--muted)}
.console .tile b{font-size:1.45rem}
.console .tile small.why{color:var(--muted);font-size:.78rem;margin-top:4px}
.console a.tile:hover{background:var(--surface);border-color:var(--blue-ink)}
.console .tile small.sub{color:var(--muted);font-size:.8rem;margin-top:auto;padding-top:8px}
.spark{width:100%;height:34px;margin-top:8px;overflow:visible}
.spark .area{fill:var(--c1);fill-opacity:.12;stroke:none}
.spark .ln{fill:none;stroke:var(--c1);stroke-width:1.5;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--c1)}
.console .todo{background:var(--bg)}
.console .viz .chart{max-width:none}
.viz .chart.bars{max-width:720px}
.spark rect{fill:var(--c1)}
.sechead a{margin-left:auto;font-size:.88rem;font-weight:600}
.activity table{border:1px solid var(--line);border-radius:10px;border-collapse:separate;border-spacing:0;width:100%}
.activity td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.92rem}
.activity tr:last-child td{border-bottom:0}
@media (max-width:860px){.console .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.console .tile b{font-size:1.15rem}}
@media (max-width:860px){
  #app.console{display:block;padding-left:max(16px,env(safe-area-inset-left,0px))}
  #app.console .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
  .side .proj{flex:1;min-width:0}
  .side .newbtn span{display:none}
  .side nav{display:flex;width:100%;overflow-x:auto;gap:4px;padding-bottom:2px}
  .side h6{display:none}
  .side nav a{white-space:nowrap;flex:none}
  #app.console .pane{padding:16px 0 32px}
  .phead h1{font-size:1.3rem}
}

/* Trove Digital */
.dnav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 18px;overflow-x:auto}
.dnav a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.dnav a[aria-current=true]{color:var(--ink);border-bottom-color:var(--orange-hover)}
[data-only][hidden]{display:none !important}
.drop a.dmenu{display:none}
@media (max-width:480px){nav.main>a.dlink{display:none}.drop a.dmenu{display:block}}
.dtag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--orange);color:var(--orange-ink);vertical-align:middle;margin-right:4px}
.dcard .ph{position:relative}
.kind{position:absolute;left:8px;top:8px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.kind.k-session{background:var(--blue);color:var(--blue-ink)}
.kind.k-download{background:var(--orange);color:var(--orange-ink)}
.kind.k-ingame{background:color-mix(in srgb,var(--c3) 22%,var(--bg));color:var(--ink)}
.eyebrow{margin:0 0 6px;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dhero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px 18px;margin-bottom:20px}
.dhero h1{margin:0 0 8px;font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.15;max-width:22ch}
.dhero .lede{margin-bottom:16px}
.dsearch{display:flex;gap:8px;max-width:560px;margin-bottom:14px}
.dsearch input{flex:1;min-width:0}
.dhero .cats{margin-bottom:0}
.dhero .cats a{background:var(--bg)}
.dhero .cats a[aria-current=true]{background:var(--blue)}
.dhow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.dhow div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dhow b{display:block;margin-bottom:2px}
.dhow span{color:var(--muted);font-size:.9rem}
.dsell{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.dsell h2{margin:0 0 4px} .dsell p{margin:0;max-width:56ch}
.crumb{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.crumb a{color:var(--muted)}
.buybox{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0 20px;background:var(--bg)}
.buybox button[type=submit]{width:100%}
.slots{border:0;padding:0;margin:0 0 12px;min-width:0}
.slots legend{margin-bottom:8px}
.sday{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.sday>span{width:100%;font-size:.84rem;font-weight:700;color:var(--muted)}
.slotbtn{position:relative;cursor:pointer}
.slotbtn input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.slotbtn span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;font-variant-numeric:tabular-nums;background:var(--surface)}
.slotbtn input:checked+span{background:var(--blue);border-color:var(--blue-ink);color:var(--blue-ink);font-weight:700}
.slotbtn input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.dfile{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);margin:0 0 6px;word-break:break-word}
.kinds .radio{margin-bottom:6px}
@media (min-width:700px){.kinds{display:grid !important;grid-template-columns:1fr 1fr;column-gap:8px}.kinds legend{grid-column:1/-1}}
@media (max-width:640px){.dhow{grid-template-columns:1fr}.dhero{padding:20px 16px 14px}.dsearch button{padding-inline:14px}}

/* Pulse: the futuristic dashboard tab. Always dark, its own tokens. */
.pulse{--p-bg:#070b14;--p-panel:#0c1322;--p-line:rgba(110,160,255,.16);--p-ink:#e6f0ff;--p-muted:#8794b0;--p-c1:#169dbd;--p-c2:#e2549d;--p-c3:#8270ff;--p-c4:#bd8121;--p-glow:#5fe3ff;--p-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--p-ink);background:radial-gradient(1200px 500px at 15% -10%,rgba(22,157,189,.22),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(130,112,255,.18),transparent 60%),
  linear-gradient(rgba(110,160,255,.05) 1px,transparent 1px) 0 0/100% 28px,var(--p-bg);border-radius:18px;padding:16px;border:1px solid var(--p-line);color-scheme:dark;overflow:hidden}
.pulse a{color:var(--p-glow)}
.ptop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font:600 .78rem var(--p-mono);letter-spacing:.12em;margin-bottom:10px}
.ptop b{font-weight:700} .ptop a{margin-left:auto;letter-spacing:0;font-family:var(--sans);font-size:.84rem}
.pclockt{color:var(--p-muted)}
.plive{display:inline-flex;align-items:center;gap:6px;color:#ff6b8a}
.plive i{width:8px;height:8px;border-radius:50%;background:#ff6b8a;box-shadow:0 0 10px #ff6b8a;animation:pblink 1.4s ease-in-out infinite}
.ptick{overflow:hidden;border:1px solid var(--p-line);border-radius:10px;background:rgba(12,19,34,.8);margin-bottom:14px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ptrack{display:flex;gap:34px;width:max-content;padding:8px 0;animation:pmarq 50s linear infinite;font:500 .8rem var(--p-mono);color:var(--p-muted);white-space:nowrap}
.ptrack span{display:inline-flex;align-items:center;gap:8px}
.ptrack i{width:6px;height:6px;border-radius:50%;background:var(--p-c3)}
.ptrack .k-sale{color:var(--p-ink)} .ptrack .k-sale i{background:var(--p-c1);box-shadow:0 0 8px var(--p-c1)}
.ptrack .k-cart i{background:var(--p-c2)} .ptrack .k-question i{background:var(--p-c4)}
.pheros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.phero{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--p-panel);border:1px solid var(--p-line);cursor:pointer;color:var(--p-ink);transition:border-color .2s,box-shadow .2s}
.phero:disabled{cursor:default}
.phero:not(:disabled):hover{border-color:rgba(95,227,255,.45)}
.phero.on{border-color:var(--p-c1);box-shadow:0 0 0 1px var(--p-c1),0 0 24px rgba(22,157,189,.35) inset}
.phero:focus-visible{outline:2px solid var(--p-glow);outline-offset:2px}
.phero>span{font:600 .72rem var(--p-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--p-muted)}
.phero b{font:700 clamp(1.4rem,2.6vw,2rem) var(--p-mono);letter-spacing:-.02em;text-shadow:0 0 18px rgba(95,227,255,.35)}
.phero small{font-size:.8rem;font-weight:700} .phero small em{font-style:normal;font-weight:400;color:var(--p-muted)}
.phero small.up{color:#4fd69c} .phero small.down{color:#ff7a8a}
.phero i{font-style:normal;font-size:.8rem;color:var(--p-muted)}
.pgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.pz{grid-column:span 4;position:relative;background:linear-gradient(180deg,rgba(22,157,189,.07),transparent 45%),var(--p-panel);border:1px solid var(--p-line);border-radius:14px;padding:14px 16px;min-width:0}
.pz::before,.pz::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--p-c1);opacity:.7}
.pz::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.pz::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.pz.c8{grid-column:span 8} .pz.c7{grid-column:span 7} .pz.c5{grid-column:span 5}
.pz h3{margin:0;display:flex;align-items:center;gap:8px;font:700 .74rem var(--p-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--p-ink)}
.pz h3 i{width:6px;height:6px;border-radius:50%;background:var(--p-glow);box-shadow:0 0 8px var(--p-glow)}
.psub{margin:4px 0 8px;color:var(--p-muted);font-size:.84rem;line-height:1.4}
.pz svg{display:block;width:100%;height:auto;overflow:visible}
.pz text{font-family:var(--p-mono)}
.pz .ax{fill:var(--p-muted);font-size:10px}
.pz .g{stroke:var(--p-line);stroke-dasharray:2 4}
.pz .hit{fill:transparent;cursor:crosshair;outline:none}
.pz .hit:hover,.pz .hit:focus{fill:rgba(95,227,255,.08)}
.pz [data-tip]{cursor:pointer;outline:none}
.pz [data-tip]:focus-visible{stroke:#fff;stroke-width:2}
.tip-dot{fill:#fff} .ping{fill:none;stroke:var(--p-glow);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pping 2s ease-out infinite}
.pgauge{display:grid;gap:10px}
.pgauge svg{max-width:260px;margin:0 auto}
.pgauge .ticks line{stroke:rgba(135,148,176,.35);stroke-width:1.5} .pgauge .ticks line.on{stroke:var(--p-glow)}
.pgauge .track{fill:none;stroke:rgba(135,148,176,.18);stroke-width:10;stroke-linecap:round}
.pgauge .val{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:100;animation:pdraw 1.4s ease-out both}
.pgauge .big{fill:var(--p-ink);font-size:44px;font-weight:700;text-anchor:middle}
.pz .lab{fill:var(--p-muted);font-size:10px;letter-spacing:.2em;text-anchor:middle}
.pz .lab2{fill:var(--p-ink);font-size:11px;text-anchor:middle}
.pkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.pkpis div{border:1px solid var(--p-line);border-radius:10px;padding:6px 4px}
.pkpis b{display:block;font:700 1rem var(--p-mono)} .pkpis span{font-size:.72rem;color:var(--p-muted)}
.psighead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.psighead b{display:block;font:700 1.6rem var(--p-mono);text-shadow:0 0 18px rgba(95,227,255,.35)}
.psighead span{color:var(--p-muted);font-size:.8rem}
.pulse .seg{background:rgba(255,255,255,.05);margin:0}
.pulse .seg button{color:var(--p-muted);font-size:.8rem;padding:5px 12px}
.pulse .seg button[aria-pressed=true]{background:var(--p-c1);color:#fff;box-shadow:0 0 14px rgba(22,157,189,.6)}
.psig .ln{fill:none;stroke:var(--p-c1);stroke-width:2;stroke-linejoin:round;stroke-dasharray:100;animation:pdraw 1.6s ease-out both}
.psig .scan{animation:pscan 4.5s linear infinite}
.pclock .ring{fill:none;stroke:var(--p-line)}
.pclock .sp line{stroke:var(--p-c1);stroke-width:5;stroke-linecap:round;transform-origin:100px 100px;animation:pgrow .8s ease-out both}
.pclock .sp line:hover,.pclock .sp line:focus{stroke:var(--p-glow)}
.pclock .mid{fill:var(--p-ink);font-size:11.5px;font-weight:700;text-anchor:middle}
.porbit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.porbit .orb{fill:none;stroke:var(--p-line);stroke-dasharray:2 3}
.porbit .sun{fill:var(--p-c4);filter:drop-shadow(0 0 10px rgba(189,129,33,.8))}
.porbit .sunt{fill:#120b02;font-size:13px;font-weight:700;text-anchor:middle}
.porbit .spin{transform-origin:100px 100px;animation:pspin 30s linear infinite}
.porbit .spin:hover{animation-play-state:paused}
.plegend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.8rem}
.plegend li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.plegend i{width:10px;height:10px;border-radius:3px}
.plegend span{color:var(--p-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .plegend b{font-family:var(--p-mono);font-size:.82rem}
.pradar .web{fill:none;stroke:var(--p-line)}
.pradar .shape{fill:rgba(130,112,255,.25);stroke:var(--p-c3);stroke-width:2;stroke-linejoin:round;transform-origin:100px 100px;animation:ppop 1s ease-out both}
.pradar .v{fill:#fff;stroke:var(--p-c3);stroke-width:2}
.pflow .band{opacity:.9}
.pflow .dots{fill:none;stroke:var(--p-glow);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1 14;animation:pflow 1.2s linear infinite;opacity:.8}
.pz .fv{fill:var(--p-ink);font-size:12px;font-weight:700}
.phex .hx{fill:var(--p-c1);stroke:rgba(110,160,255,.18);stroke-width:1}
.phex .hx.lit{stroke:var(--p-glow);stroke-opacity:.5;filter:drop-shadow(0 0 3px rgba(95,227,255,.6))}
.phex .hx:hover,.phex .hx:focus{stroke:#fff;stroke-opacity:1}
.peq .floor{stroke:var(--p-line)}
.peq .bar{transform-box:fill-box;transform-origin:bottom;animation:pgrowy .9s cubic-bezier(.2,.8,.2,1) both}
.peq .bar rect{filter:drop-shadow(0 0 6px rgba(226,84,157,.45))}
.prings{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:16px;align-items:center}
.prings .trk{fill:none;stroke:rgba(135,148,176,.15);stroke-width:11}
.prings .arc{fill:none;stroke-width:11;stroke-linecap:round;animation:pring 1.4s ease-out both}
@keyframes pdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes pring{from{stroke-dasharray:0 100}}
@keyframes pscan{from{transform:translateX(0)}to{transform:translateX(640px)}}
@keyframes pspin{to{transform:rotate(360deg)}}
@keyframes pping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes pblink{50%{opacity:.25}}
@keyframes pmarq{to{transform:translateX(-50%)}}
@keyframes pflow{to{stroke-dashoffset:-15}}
@keyframes pgrow{from{opacity:0}}
@keyframes pgrowy{from{transform:scaleY(0)}}
@keyframes ppop{from{transform:scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse *,.pulse *::before{animation:none !important}}
@media (max-width:1100px){.pz,.pz.c5,.pz.c7{grid-column:span 6}.pz.c8{grid-column:span 12}.pheros{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.pz{overflow-x:auto}.pz .psig,.pz .pflow,.pz .peq{min-width:540px}.pz,.pz.c5,.pz.c7,.pz.c8{grid-column:span 12}.pulse{padding:12px;border-radius:14px}.ptop a{margin-left:0}.prings{grid-template-columns:140px 1fr}}
</style>
</head>
